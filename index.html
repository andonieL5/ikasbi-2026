<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IKASBI 2026</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- ==================================================
         APLICACIÓN PRINCIPAL
    =================================================== -->

    <main id="app">


        <!-- ==================================================
             CABECERA / TÍTULO
        =================================================== -->

        <header class="main-header">

            <h1>IKASBI 2026</h1>

            

        </header>



        <!-- ==================================================
             MAPA DE EUROPA
        =================================================== -->

        <section id="map-container">

            <div id="map">

                <!--
                    El mapa vectorial de Europa
                    se cargará posteriormente aquí.
                -->


                <!-- ==================================================
                     RECORRIDO DEL VIAJE
                =================================================== -->

                <div id="route"></div>



                <!-- ==================================================
                     CIUDADES
                =================================================== -->

                <button
                    class="city-button"
                    id="city-tolosa"
                    data-city="Tolosa"
                >
                    Tolosa
                </button>


                <button
                    class="city-button"
                    id="city-clermont"
                    data-city="Clermont-Ferrand"
                >
                    Clermont-Ferrand
                </button>


                <button
                    class="city-button"
                    id="city-munich"
                    data-city="Múnich"
                >
                    Múnich
                </button>


                <button
                    class="city-button"
                    id="city-prague"
                    data-city="Praga"
                >
                    Praga
                </button>


                <button
                    class="city-button"
                    id="city-berlin"
                    data-city="Berlín"
                >
                    Berlín
                </button>


                <button
                    class="city-button"
                    id="city-amsterdam"
                    data-city="Ámsterdam"
                >
                    Ámsterdam
                </button>


                <button
                    class="city-button"
                    id="city-bruges"
                    data-city="Brujas"
                >
                    Brujas
                </button>


                <button
                    class="city-button"
                    id="city-paris"
                    data-city="París"
                >
                    París
                </button>


            </div>

        </section>



        <!-- ==================================================
             PANEL LATERAL DE FOTOGRAFÍAS
        =================================================== -->

        <aside id="photo-panel">


            <!-- CABECERA DEL PANEL -->

            <div class="panel-header">

                <div>

                    <span class="panel-subtitle">
                        FOTOS DEL VIAJE
                    </span>

                    <h2 id="panel-city">
                        París
                    </h2>

                </div>


                <!-- CERRAR PANEL -->

                <button
                    id="close-panel"
                    aria-label="Cerrar panel"
                >
                    ×
                </button>

            </div>



            <!-- ==================================================
                 GALERÍA
            =================================================== -->

            <div id="gallery">

                <!--
                    Las fotografías se añadirán
                    automáticamente mediante JavaScript.
                -->

            </div>



            <!-- ==================================================
                 AÑADIR FOTOGRAFÍAS
            =================================================== -->

            <button
                id="add-photo-button"
                aria-label="Añadir fotografías"
            >
                +
            </button>


        </aside>



        <!-- ==================================================
             VISOR DE FOTOGRAFÍAS
        =================================================== -->

        <div id="photo-viewer">


            <!-- CERRAR FOTO -->

            <button
                id="close-viewer"
                aria-label="Cerrar fotografía"
            >
                ×
            </button>



            <!-- DESCARGAR FOTO -->

            <button
                id="download-photo"
                aria-label="Descargar fotografía"
            >
                ↓
            </button>



            <!-- FOTO AMPLIADA -->

            <img
                id="viewer-image"
                src=""
                alt="Fotografía del viaje"
            >


        </div>


    </main>



    <!-- ==================================================
         D3.JS
         Biblioteca que utilizaremos para el mapa
    =================================================== -->

    <script
        src="https://d3js.org/d3.v7.min.js">
    </script>



    <!-- ==================================================
         JAVASCRIPT DEL PROYECTO
    =================================================== -->

    <script src="js/app.js"></script>

    <script src="js/map.js"></script>

    <script src="js/gallery.js"></script>


</body>

</html>
