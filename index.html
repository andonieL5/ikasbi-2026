<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>IKASBI 2026</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="app">
        <header class="main-header">
            <h1>IKASBI 2026</h1>
        </header>

        <section id="map-container" aria-label="Mapa del viaje">
            <div id="map">
                <div id="route" aria-hidden="true"></div>

                <button class="city-button" id="city-tolosa" type="button">Tolosa</button>
                <button class="city-button" id="city-clermont" type="button">Clermont-Ferrand</button>
                <button class="city-button" id="city-munich" type="button">Múnich</button>
                <button class="city-button" id="city-prague" type="button">Praga</button>
                <button class="city-button" id="city-berlin" type="button">Berlín</button>
                <button class="city-button" id="city-amsterdam" type="button">Ámsterdam</button>
                <button class="city-button" id="city-bruges" type="button">Brujas</button>
                <button class="city-button" id="city-paris" type="button">París</button>
            </div>
        </section>

        <aside id="photo-panel" aria-label="Galería de fotos" aria-hidden="true">
            <div class="panel-header">
                <div>
                    <span class="panel-subtitle">FOTOS DEL VIAJE</span>
                    <h2 id="panel-city">Tolosa</h2>
                </div>
                <button id="close-panel" type="button" aria-label="Cerrar galería">×</button>
            </div>

            <div id="gallery"></div>
            <input id="photo-file-input" type="file" accept="image/*" multiple hidden>
        </aside>

        <div id="photo-viewer" aria-hidden="true">
            <button id="close-viewer" type="button" aria-label="Cerrar fotografía">×</button>

            <button id="previous-photo" class="viewer-arrow viewer-arrow-left"
                    type="button" aria-label="Fotografía anterior">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 5l-7 7 7 7"></path>
                </svg>
            </button>

            <button id="next-photo" class="viewer-arrow viewer-arrow-right"
                    type="button" aria-label="Fotografía siguiente">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 5l7 7-7 7"></path>
                </svg>
            </button>

            <div id="photo-counter" aria-live="polite">0 / 0</div>

            <button id="download-photo" type="button" aria-label="Descargar fotografía">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v11"></path>
                    <path d="M7 10l5 5 5-5"></path>
                    <path d="M5 20h14"></path>
                </svg>
                <span>Descargar</span>
            </button>

            <img id="viewer-image" alt="Fotografía del viaje">
        </div>
    </main>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
