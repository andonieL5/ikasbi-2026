<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IKASBI 2026</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <main id="app">


        <!-- ==========================================
             CABECERA
        =========================================== -->

        <header class="main-header">

            <h1>
                IKASBI 2026
            </h1>

        </header>



        <!-- ==========================================
             MAPA
        =========================================== -->

        <section id="map-container">

            <div id="map">

                <div id="route"></div>


                <!-- CIUDADES -->

                <button
                    class="city-button"
                    id="city-tolosa"
                >
                    Tolosa
                </button>


                <button
                    class="city-button"
                    id="city-clermont"
                >
                    Clermont-Ferrand
                </button>


                <button
                    class="city-button"
                    id="city-munich"
                >
                    Múnich
                </button>


                <button
                    class="city-button"
                    id="city-prague"
                >
                    Praga
                </button>


                <button
                    class="city-button"
                    id="city-berlin"
                >
                    Berlín
                </button>


                <button
                    class="city-button"
                    id="city-amsterdam"
                >
                    Ámsterdam
                </button>


                <button
                    class="city-button"
                    id="city-bruges"
                >
                    Brujas
                </button>


                <button
                    class="city-button"
                    id="city-paris"
                >
                    París
                </button>

            </div>

        </section>



        <!-- ==========================================
             PANEL DE FOTOS
        =========================================== -->

        <aside id="photo-panel">


            <!-- CABECERA DEL PANEL -->

            <div class="panel-header">

                <div>

                    <span class="panel-subtitle">
                        FOTOS DEL VIAJE
                    </span>

                    <h2 id="panel-city">
                        París
                    </h2>

                </div>


                <button
                    id="close-panel"
                    aria-label="Cerrar"
                >
                    ×
                </button>

            </div>



            <!-- GALERÍA -->

            <div id="gallery">

                <!--
                    Las fotografías se cargarán
                    mediante JavaScript.
                -->

            </div>



            <!-- BOTÓN AÑADIR
                 Se utilizará posteriormente
                 con Firebase.
            -->

            <button
                id="add-photo-button"
                aria-label="Añadir fotografías"
            >
                +
            </button>


        </aside>



        <!-- ==========================================
             VISOR DE FOTOS
        =========================================== -->

        <div id="photo-viewer">


            <!-- CERRAR -->

            <button
                id="close-viewer"
                aria-label="Cerrar foto"
            >
                ×
            </button>



            <!-- DESCARGAR -->

            <button
                id="download-photo"
                aria-label="Descargar foto"
            >
                <span>↓</span>
            </button>



            <!-- FOTO ANTERIOR -->

            <button
                id="previous-photo"
                class="viewer-arrow"
                aria-label="Fotografía anterior"
            >
                ‹
            </button>



            <!-- FOTO SIGUIENTE -->

            <button
                id="next-photo"
                class="viewer-arrow"
                aria-label="Fotografía siguiente"
            >
                ›
            </button>



            <!-- CONTADOR -->

            <div id="photo-counter">
                1 / 12
            </div>



            <!-- IMAGEN -->

            <img
                id="viewer-image"
                src=""
                alt="Fotografía del viaje"
            >


        </div>


    </main>



    <!-- ==========================================
         D3
    =========================================== -->

    <script
        src="https://d3js.org/d3.v7.min.js"
    ></script>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/app.js"></script>

    <script src="js/map.js"></script>

    <script src="js/gallery.js"></script>


</body>

</html>
